name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run by hand when a macOS arm64 runner never picked the job up.
  workflow_dispatch:

jobs:
  build-and-test:
    # Apple silicon on macOS 26 — the package demands the macOS 26 SDK, so
    # earlier runner images can't compile it.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Print toolchain details
        run: |
          sw_vers
          swift --version

      - name: Compile
        run: ./scripts/swiftw build -c release

      - name: Run tests
        run: ./scripts/test.sh

      # Packages and ad-hoc signs the bundle; build.sh fails if the hardened
      # runtime or the microphone entitlement is missing. The audio and
      # permission layers still need a real microphone and TCC approvals, so
      # they are checked by hand.
      - name: Package and verify the signature
        run: bash build.sh
